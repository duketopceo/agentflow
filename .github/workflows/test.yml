name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  # Single required-check target: matrix job names vary with Node versions,
  # so branch protection points here instead of naming every leg.
  test-suite:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "matrix green"
