<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 16" width="448" height="64" role="img" aria-label="agentflow status glyphs">
  <title>agentflow status glyphs: ok, fail, running, replay, cache, cancelled, null</title>
  <g fill="none" stroke="#14181F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- ok -->
    <g transform="translate(0 0)"><path d="M3 8.5 L6.5 12 L13 4"/></g>
    <!-- fail -->
    <g transform="translate(16 0)"><path d="M4 4 L12 12 M12 4 L4 12"/></g>
    <!-- running: open ring with head -->
    <g transform="translate(32 0)"><path d="M13 8 A5 5 0 1 1 8 3"/><circle cx="8" cy="3" r="1.2" fill="#14181F" stroke="none"/></g>
    <!-- replay: left-pointing step back -->
    <g transform="translate(48 0)"><path d="M13 8 H4 M7.5 4.5 L4 8 L7.5 11.5"/></g>
    <!-- cache: stacked bars -->
    <g transform="translate(64 0)"><path d="M3 4.5 H13 M3 8 H13 M3 11.5 H9"/></g>
    <!-- cancelled: slashed ring -->
    <g transform="translate(80 0)"><circle cx="8" cy="8" r="5"/><path d="M4.5 11.5 L11.5 4.5"/></g>
    <!-- null: dashed ring -->
    <g transform="translate(96 0)"><circle cx="8" cy="8" r="5" stroke-dasharray="2 2.4"/></g>
  </g>
</svg>
